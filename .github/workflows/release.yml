name: Release

# Signed release build (README, "Release build"). A version tag (v0.1.0, ...) on a commit in main
# builds and publishes a GitHub Release; a manual run only builds and keeps a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The only job with the signing secrets, so it gets no write access.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0
      - name: Check tag is on main and matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points to a commit that isn't on main. Merge to main first, then tag." >&2
            exit 1
          fi
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' android/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match versionName $version in android/build.gradle.kts" >&2
            exit 1
          fi
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile install nixpkgs#devenv
      - name: Lint (ktlint, detekt, Android Lint)
        run: devenv shell -- lint
      - name: Unit tests
        run: devenv shell -- unit-test
      - name: Dependency vulnerability scan
        run: devenv shell -- vuln-scan
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SORTOPIA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Secret SORTOPIA_KEYSTORE_BASE64 is not set (see README, \"Release build\")" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
      - name: Signed release build
        env:
          SORTOPIA_KEYSTORE_FILE: ${{ runner.temp }}/upload-keystore.jks
          SORTOPIA_KEYSTORE_PASSWORD: ${{ secrets.SORTOPIA_KEYSTORE_PASSWORD }}
          SORTOPIA_KEY_ALIAS: ${{ secrets.SORTOPIA_KEY_ALIAS }}
          SORTOPIA_KEY_PASSWORD: ${{ secrets.SORTOPIA_KEY_PASSWORD }}
          # Optional repository variable: build-release then checks the APK is signed by this cert.
          SORTOPIA_UPLOAD_CERT_SHA256: ${{ vars.SORTOPIA_UPLOAD_CERT_SHA256 }}
        run: devenv shell -- build-release
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
      - name: Name release files
        id: name
        run: |
          # The tag (v0.1.0), or the branch name for a manual run ("/" isn't allowed in artifact names).
          name="sortopia-${GITHUB_REF_NAME//\//-}"
          mkdir dist
          cp android/build/outputs/apk/release/android-release.apk "dist/$name.apk"
          cp android/build/outputs/bundle/release/android-release.aab "dist/$name.aab"
          cp android/build/outputs/mapping/release/mapping.txt "dist/$name-mapping.txt"
          echo "artifact=$name" >> "$GITHUB_OUTPUT"
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          # Tag builds keep their files on the GitHub Release; this copy is only a hand-off.
          retention-days: 7

  publish:
    # Tags only. Has write access to create the release, but never sees the signing secrets.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never touch an existing release: delete it on GitHub first to redo one.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists. Delete it on GitHub to publish it again." >&2
            exit 1
          fi
          # 0.x versions are pre-releases.
          prerelease=()
          case "$GITHUB_REF_NAME" in
            v0.*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
