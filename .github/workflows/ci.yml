name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  checks:
    # Lint, unit tests, debug build and dependency vulnerability scan. Runs the same scripts/ as
    # the devenv commands, on the plain runner (no devenv in CI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Lint (ktlint, detekt, Android Lint)
        run: scripts/lint.sh
      - name: Unit tests
        run: scripts/unit-test.sh
      - name: Debug build
        run: scripts/build-debug.sh
      - name: Dependency vulnerability scan
        run: scripts/vuln-scan.sh
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            */build/reports/
          retention-days: 7

  ui-tests:
    # Emulator UI tests only for PRs into main (CLAUDE.md, CI). The long level sweep runs as its
    # own matrix job, on its own emulator, in parallel with the rest of the UI tests.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [ui-test, ui-sweep]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
        with:
          emulator: "true"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator
        run: scripts/emulator-start.sh -no-window
      - name: Emulator UI tests
        run: scripts/${{ matrix.suite }}.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite }}-reports
          # Test reports, plus the screenshots the tests save (GameDriver.screenshot).
          path: |
            android/build/reports/androidTests/
            android/build/outputs/connected_android_test_additional_output/
          retention-days: 7
