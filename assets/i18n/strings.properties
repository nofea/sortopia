card.ok=Got it
card.HIDDEN=Some items are hidden under a "?". They show themselves when they reach the top of their tube.
card.LOCKED=A padlocked tube can't be used until you complete a tube of the item shown on its lock.
card.SINGLE_TYPE=A labeled tube only accepts the item on its label. Pour anything else out of it first.
card.MIXED_CAPACITY=Tubes come in different sizes. A tube is complete when it is full of one kind.
card.GLUED=Glued pairs move together as one. Pouring flips them over, so the top one must match. Completing any tube melts all glue.
card.FROZEN=Frozen items can't move, and nothing fits on top of them. Every move counts the ice down until it melts.
card.ALL=The Gem Mine mixes every trick you have learned. Good luck!
card.basics=Pour the top items from one tube into another. Items only go onto the same kind or into an empty tube. Fill every tube with one kind to win!

tutorial.step1=Tap a tube to pick up its top items.
tutorial.step2=Now tap where they should go: onto the same kind, or into an empty tube.
tutorial.step3=Nice! Keep going. Follow the pointer.
tutorial.sealed=A tube full of one kind gets a lid. Sealed!
tutorial.finish=Sort every tube to finish the level.

